<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ecedda">
<title>溪谷建筑师 · Beaver Creek</title><meta name="description" content="成为溪谷里的小海狸：采集木材、建造桥梁、抵御水流，帮助森林伙伴平安回家。四段旅程，一座温暖的小小世界。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%233b5642'/%3E%3Ccircle cx='20' cy='19' r='9' fill='%23aa7850'/%3E%3Ccircle cx='44' cy='19' r='9' fill='%23aa7850'/%3E%3Cellipse cx='32' cy='35' rx='22' ry='20' fill='%23bd8b5b'/%3E%3Ccircle cx='24' cy='31' r='3' fill='%232d3024'/%3E%3Ccircle cx='40' cy='31' r='3' fill='%232d3024'/%3E%3Cellipse cx='32' cy='39' rx='8' ry='5' fill='%234b3627'/%3E%3Cpath d='M26 43h12v9H26z' fill='%23fff8dd'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="game" aria-label="溪谷建筑师 3D 游戏">
<canvas id="world" aria-label="森林溪谷游戏场景，使用方向键或 WASD 移动，E 采集，B 建桥，F 护送"></canvas>
<div class="vignette"></div>
<header class="topbar">
 <div class="brand"><span class="brand-mark">▰</span><div><strong>溪谷建筑师</strong><small>BEAVER CREEK</small></div><span class="edition">森林救援记</span></div>
 <div class="resources" aria-label="资源"><div class="resource"><span class="res-icon wood">▰</span><span><b id="wood">12</b><small>木材</small></span></div><i></i><div class="resource"><span class="res-icon stone">◆</span><span><b id="stone">3</b><small>石材</small></span></div><i></i><div class="resource"><span class="res-icon leaf">✦</span><span><b id="coins">0</b><small>橡果币</small></span></div></div>
 <div class="top-actions"><button id="soundBtn" class="icon-button" title="开启声音" aria-label="开启声音">♫<span class="off-dot"></span></button><button id="helpBtn" class="icon-button" title="玩法指南" aria-label="玩法指南">?</button><button id="pauseBtn" class="icon-button" title="暂停游戏" aria-label="暂停游戏">Ⅱ</button></div>
</header>
<aside class="mission panel">
 <div class="eyebrow"><span class="live-dot"></span><span id="chapter">CHAPTER 01 / 04</span><button id="mapBtn" title="查看旅程">旅程 ↗</button></div>
 <h1 id="levelTitle">初见溪谷</h1><p id="levelDesc">为等待的小伙伴，搭一条回家的路。</p>
 <div class="mission-progress"><span>护送动物</span><strong><b id="rescued">0</b> / <b id="total">3</b></strong></div>
 <div class="progress-track"><div id="progressFill"></div></div>
 <div id="animalQueue" class="animal-queue"></div>
 <div class="mission-footer"><span id="weather">☀ 晴空 · 缓流</span><span id="timer">05:00</span></div>
</aside>
<div class="location-label"><span>THE WOODLANDS</span><i></i><b>苔光森林 · 春日</b></div>
<aside class="right-rail"><button id="upgradeBtn" class="rail-button"><span>⌂</span><b>工匠小屋</b><small>升级装备</small></button><button id="viewBtn" class="rail-button"><span>⤢</span><b>俯瞰溪谷</b><small>切换视角</small></button><div class="wind-card"><span>↓</span><small>水流方向</small></div></aside>
<div id="worldLabels" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="context" class="context hidden"><kbd>E</kbd><span>收集木材</span></div>
<div id="hint" class="hint"><span>✧</span><p>一座小桥，就是一次新的相遇。</p></div>
<div class="bottom-ui">
 <div class="beaver-status panel"><div class="avatar">🦫</div><div><strong>阿木 <span>溪谷工匠</span></strong><div class="energy-track"><div id="energyFill"></div></div><small id="statusText">精力充沛，开工吧！</small></div></div>
 <nav class="toolbar" aria-label="行动工具">
 <button class="tool active" data-mode="move"><kbd>1</kbd><span class="tool-symbol">↖</span><strong>漫游</strong></button>
 <button class="tool" data-mode="gather"><kbd>2</kbd><span class="tool-symbol">⚒</span><strong>采集</strong></button>
 <button class="tool" data-mode="build"><kbd>3</kbd><span class="tool-symbol bridge-icon">≋</span><strong>搭桥</strong></button>
 <button class="tool" data-mode="reinforce"><kbd>4</kbd><span class="tool-symbol">⬡</span><strong>加固</strong></button>
 <button class="tool" data-mode="repair"><kbd>5</kbd><span class="tool-symbol">✚</span><strong>修复</strong></button>
 <button class="tool escort" id="escortBtn"><kbd>F</kbd><span class="tool-symbol">⚑</span><strong>护送</strong></button>
 </nav>
 <div class="controls-copy"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span><span><kbd>E</kbd> 互动 · <kbd>Shift</kbd> 冲刺</span></div>
</div>
<div class="touch-controls"><div class="dpad"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div><button id="touchAction">互动</button></div>
<div id="modalBackdrop" class="modal-backdrop hidden"><section id="modal" class="modal panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
<div id="loading"><div class="loading-beaver">🦫</div><h2>溪谷正在苏醒</h2><p>为每一位伙伴，搭一条回家的路。</p></div>
</main>
<script type="module" src="./game.js"></script>
</body></html>
