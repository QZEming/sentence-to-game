<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARIONETTE · 午夜木偶剧场</title><meta name="description" content="操纵提线木偶穿过五幕立体剧场，在平衡、跳跃、侧风与摆锤挑战中完成你的演出。"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div id="marionette-game">

<header class="top"><div class="brand">MARIONETTE<small>午夜木偶剧场</small></div><nav class="nav" aria-label="游戏模式"><button class="active" data-mode="story">舞台挑战</button><button data-mode="practice">自由排练</button><button id="mg-help">操作指南</button></nav><div class="tools"><button class="icon" id="mg-sound" title="开启音效" aria-label="开启音效">♪</button><button class="icon" id="mg-pause" title="暂停 / 继续" aria-label="暂停或继续">Ⅱ</button></div></header>
<div class="body"><aside><div class="eyebrow">THE PLAYBILL</div><h2>今夜的演出</h2><div class="acts" id="mg-acts"></div><div class="side-bottom">累计获得星光<strong id="mg-total">0 / 15</strong><div>每一次登台，都可以重来。</div><button class="small-button" id="mg-retry">重新开始本幕</button></div></aside><main class="stage"><div class="canvas" id="mg-canvas"></div><div class="vignette"></div><div class="stage-head"><div><div class="chapter" id="mg-chapter">ACT I · THE FIRST STRING</div><h1 id="mg-title">初次登台</h1><div class="goal" id="mg-goal">青环稳住 2 秒 · 收集 2 星 · 抵达终点。</div></div><div class="metrics"><div class="score-metric"><span>演出得分</span><b id="mg-score">0000</b></div><div><span>星光</span><b class="starcount" id="mg-stars">0 / 3</b></div><div><span>舞台时间</span><b id="mg-time">00:00</b></div></div></div><div class="wind" id="mg-wind"></div><div class="banner" id="mg-banner" role="status" aria-live="polite"></div><div class="bottom-hud"><div class="balance"><div class="balance-label"><span>身体平衡</span><b id="mg-balance-label">稳稳当当</b></div><div class="balance-track"><div class="balance-safe"></div><div class="balance-needle" id="mg-needle"></div></div><div class="falls">跌落 <span id="mg-falls">0</span> 次 · <span id="mg-checkpoint">起点</span></div></div><div class="status"><strong id="mg-status">等待开场</strong><span>收集星光，走进终点光环</span></div></div><div class="overlay ready" id="mg-overlay"><div class="modal"><div class="overline">THE CURTAIN RISES</div><div><h2>准备好登台了吗？</h2><p>WASD 移动，Q / E 提线。<br>双线收紧，稳住你的舞步。</p></div><button class="primary" id="mg-start" disabled>布置舞台中…</button></div></div></main></div>
<footer class="footer"><div class="bindings"><span><kbd>W A S D</kbd> 移动</span><span><kbd>SPACE</kbd> 跳跃</span><span><kbd>Q</kbd><kbd>E</kbd> 提线</span><span><kbd>P</kbd> 暂停</span></div><div class="pulls"><button class="pull" data-hold="KeyQ">Q · 左提线</button><button class="pull" data-hold="ShiftLeft">双线 · 稳住</button><button class="pull" data-hold="KeyE">E · 右提线</button></div></footer><div class="touch"><div class="dpad"><span></span><button data-hold="KeyW" aria-label="向前移动">↑</button><span></span><button data-hold="KeyA" aria-label="向左移动">←</button><button data-hold="KeyS" aria-label="向后移动">↓</button><button data-hold="KeyD" aria-label="向右移动">→</button></div><button class="jump" data-hold="Space">跳跃</button><button class="pull" id="mg-touch-reset">返回检查点</button></div>
</div>


<script type="module" src="game.mjs"></script>
</body></html>
