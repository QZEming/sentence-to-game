<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#172c27"/><title>鸦林疑案 · RAVENWOOD</title></head><body><div id="app"><canvas id="world"></canvas><div class="vignette"></div><header><a class="brand" href="#"><span class="brand-icon">♜</span><span>RAVENWOOD<small>鸦 林 疑 案</small></span></a><div class="chapter"><span class="live-dot"></span>第一章 <i>/</i> 雾中的来信</div><div class="header-actions"><button id="sound" title="环境音开关">♫ <span>环境音关闭</span></button><button id="help" title="操作指南">?</button><button id="pause" title="暂停">Ⅱ</button></div></header><section class="case-panel"><div class="eyebrow">CASE FILE <span>NO. 001</span></div><h1>消失的守林人</h1><p>暮色降临之后，森林藏起了一个秘密。</p><div class="divider"></div><div class="objective-label"><span>当前目标</span><span id="progress">0 / 6</span></div><h3 id="objective">调查守林人的营地</h3><p id="objective-detail">靠近发光的物件，寻找失踪的线索。</p><div class="progress-track"><div id="progress-bar"></div></div><div class="mission"><span class="small-diamond">◇</span><span id="mission">检查营地里遗留的物品</span></div><button class="text-button" id="journal-open">打开案件手册 <span>J ↗</span></button></section><div class="location"><span>⌖</span><div><strong id="location-name">守林人营地</strong><small>RANGER'S CAMPSITE</small></div></div><div id="world-labels"></div><section class="map-panel"><div class="map-title"><span>迷雾森林</span><span>N ↑</span></div><canvas id="minimap" width="190" height="150"></canvas><div class="map-foot"><span><i></i>你的坐标</span><button id="map-open">展开地图 <kbd>M</kbd></button></div></section><div id="toast" role="status"></div><div id="interaction"></div><div class="bottom-left"><span class="avatar">♟</span><div><strong>渡鸦 · 阿墨</strong><span>森林调查员 <i>•</i> <b id="mode">步行探索中</b></span></div></div><nav class="tools"><button class="tool active" id="explore"><span>⌖</span><strong>探索</strong><kbd>WASD</kbd></button><button class="tool" id="scan"><span>◉</span><strong>鸦之视野</strong><kbd>Q</kbd></button><button class="tool" id="fly"><span>羽</span><strong>低空飞行</strong><kbd>F</kbd></button><div class="tool-divider"></div><button class="tool" id="clues-open"><span>▣</span><strong>线索手册</strong><kbd>J</kbd></button><button class="tool" id="deduce-open"><span>♧</span><strong>推理之线</strong><kbd>R</kbd></button></nav><div class="bottom-right"><span class="save-dot"></span>进度自动保存<small>点击地面移动 · 拖动视角 · 滚轮缩放</small></div><div id="modal" class="modal hidden"><div class="modal-card"><button id="close-modal" class="close">×</button><div id="modal-body"></div></div></div><div class="mobile-controls"><button data-key="w">↑</button><div><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div></div></div><script type="module" src="/src/main.js"></script></body></html>
