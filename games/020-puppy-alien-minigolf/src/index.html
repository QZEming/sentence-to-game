<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141123"><meta name="description" content="和小狗宇航员一起，在六座外星球场打迷你高尔夫。穿过虫洞、收集星星、挑战一杆进洞。"><title>星际汪汪高尔夫 · Cosmic Pup</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237b5cff'/%3E%3Ctext x='8' y='49' font-size='48'%3E🐾%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div id="viewport" aria-label="3D 迷你高尔夫球场"></div>
  <header class="topbar"><a class="brand" href="./" aria-label="星际汪汪高尔夫首页"><span class="brandmark">✦</span><span>COSMIC<span class="brand-light">PUP</span><small>星际汪汪高尔夫</small></span></a><div class="journey"><span class="journey-tag">银河巡回赛</span><div id="progress-dots" class="progress-dots"></div></div><nav class="top-actions"><button id="courses-btn" class="quiet-btn"><span>▦</span> <span class="wide-label">球场地图</span></button><button id="sound-btn" class="icon-btn" title="开启音效" aria-label="开启音效">♪<span class="slash"></span></button><button id="help-btn" class="icon-btn" title="玩法说明" aria-label="玩法说明">?</button></nav></header>
  <main class="hud">
    <section class="course-info"><div class="eyebrow"><span class="signal"></span><span id="planet-label">KEPLER–186F</span><span class="tiny-line"></span><span>任务 <b id="hole-num">01</b> / 06</span></div><h1 id="course-name">初次着陆</h1><p id="course-description">一小步挥杆，一大步汪星探索。</p><div class="course-badges"><span id="mechanic-label">✦ 新手轨道</span><span id="gravity-label">重力 0.6 g</span></div><div class="score-strip"><div><span>本洞杆数</span><strong id="strokes">0</strong></div><div><span>标准杆</span><strong id="par">3</strong></div><div><span>星星</span><strong id="stars-count" class="star-text">0<span>/ 3</span></strong></div></div><div id="mission-tip" class="mission-tip"><span class="tip-symbol">◎</span><p id="level-tip">瞄准旗杆，轻轻挥出你的第一杆。</p></div></section>
    <aside class="right-hud"><span class="live-badge"><i></i> 自由探索</span><div class="camera-actions"><button id="rotate-left" title="向左旋转视角" aria-label="向左旋转视角">↶</button><button id="camera-btn" title="切换俯视视角" aria-label="切换俯视视角">⌖</button><button id="rotate-right" title="向右旋转视角" aria-label="向右旋转视角">↷</button></div><span class="camera-label">观察球场</span><div class="wind-readout"><span id="wind-arrow">↗</span><div><small>太空风</small><b id="wind-value">平静</b></div></div></aside>
    <div id="toast" class="toast" role="status"></div><div id="ball-label" class="ball-label">汪！准备出发 <span>↓</span></div>
    <div class="companion"><div class="dog-avatar">🐶</div><div><strong>指挥官 · 麻薯 <span>LV. 01</span></strong><p id="dog-message">今天的目标：把星星和小球都带回家。</p></div></div>
    <section class="shot-panel" aria-label="击球控制"><div class="shot-panel-top"><div class="ready-status"><i id="ready-light"></i><span id="ready-text">准备击球</span></div><div class="shot-types" role="group" aria-label="选择击球方式"><button id="putt-btn" class="selected">推杆</button><button id="loft-btn">高抛 <small>越障</small></button></div><button id="undo-btn" class="undo-btn" title="每洞可免费撤销一次">↶ <span>重来一次</span><small id="undo-count">1</small></button></div><div class="power-row"><span class="power-label">力度</span><input id="power" aria-label="击球力度" type="range" min="5" max="100" value="45"><strong id="power-value">45<span>%</span></strong><button id="shoot-btn" class="shoot-btn">挥杆 <span>SPACE</span></button></div><div class="control-hint"><span><kbd>鼠标</kbd> 指向瞄准 · 往后拖动蓄力</span><span><kbd>空格</kbd> 按住蓄力，松开击球</span><span class="keyboard-hint"><kbd>A</kbd><kbd>D</kbd> 微调</span></div></section>
    <footer class="game-footer"><span>宇宙很大，慢慢打。<i>✧</i></span><button id="restart-btn">↻ 重新挑战本洞</button><span id="best-score">个人最佳 · 等待创造</span></footer>
  </main>
  <div id="loading" class="loading"><span class="loading-orbit">✦</span><h2>麻薯正在降落…</h2><p>检查球杆，准备探索银河。</p></div>
  <div id="modal" class="modal" hidden><div class="modal-backdrop"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="close-btn" aria-label="关闭">×</button><div id="modal-content"></div></section></div>
</div>
<script type="module" src="./game.js"></script>
</body></html>
