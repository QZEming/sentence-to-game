<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一句话，100 个游戏。收录原始提示词、源码和可以直接体验的游戏。">
  <title>一句话，100 个游戏 · sentence-to-game</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202836; background: #f7f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1040px; margin: 0 auto; padding: 64px 24px 40px; }
    a { color: #304e87; text-underline-offset: 4px; }
    a:hover { color: #152b52; }
    a:focus-visible { outline: 3px solid #6384bd; outline-offset: 4px; }
    .eyebrow { font-size: 14px; letter-spacing: .04em; color: #68717f; }
    h1 { margin: 14px 0; font-size: clamp(30px, 5vw, 48px); letter-spacing: -.04em; line-height: 1.2; }
    .intro { max-width: 650px; color: #68717f; font-size: 17px; line-height: 1.8; }
    .progress { display: flex; align-items: center; gap: 18px; margin: 28px 0 42px; }
    .progress strong { font-size: 15px; white-space: nowrap; }
    progress { width: min(280px, 50vw); height: 8px; accent-color: #304e87; border: 0; border-radius: 8px; overflow: hidden; }
    progress::-webkit-progress-bar { background: #e3e6e9; }
    progress::-webkit-progress-value { background: #304e87; }
    .collection { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px; }
    .game, .empty { background: #fff; border: 1px solid #e3e6e9; border-radius: 14px; padding: 26px; }
    .number { color: #7a8492; font-size: 13px; font-variant-numeric: tabular-nums; }
    h2 { margin: 12px 0 24px; font-size: 22px; line-height: 1.4; overflow-wrap: anywhere; }
    .links { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 14px; }
    .play { font-weight: 600; }
    .empty { padding: 42px 28px; }
    .empty h2 { margin: 0 0 12px; }
    .empty p { margin: 0; color: #68717f; line-height: 1.8; }
    footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid #e3e6e9; color: #68717f; font-size: 14px; line-height: 1.8; }
    @media (max-width: 520px) { main { padding: 40px 18px 28px; } .intro { font-size: 16px; } .progress { margin-bottom: 30px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">sentence-to-game</div>
      <h1>一句话，100 个游戏。</h1>
      <p class="intro">记录用一句话做出游戏的过程。每个游戏都保留原始提示词、源码和体验地址，让想法可以被试玩，也可以被继续改造。</p>
      <div class="progress">
        <strong>3 / 100</strong>
        <progress value="3" max="100" aria-label="已收录 3 个游戏"></progress>
      </div>
    </header>
    <section class="collection" aria-label="游戏合集">
      <article class="game">
  <span class="number">001</span>
  <h2>鹈鹕漫游记 · Pelican Pedal</h2>
  <div class="links">
    <a class="play" href="games/001-pelican-pedal/">开始体验 <span aria-hidden="true">↗</span></a>
    <a href="https://github.com/QZEming/sentence-to-game/tree/main/games/001-pelican-pedal/src">源码</a>
    <a href="https://github.com/QZEming/sentence-to-game/blob/main/games/001-pelican-pedal/prompt.txt">提示词</a>
  </div>
</article>
<article class="game">
  <span class="number">002</span>
  <h2>羽境 · Shuttle Arena</h2>
  <div class="links">
    <a class="play" href="games/002-shuttle-arena/">开始体验 <span aria-hidden="true">↗</span></a>
    <a href="https://github.com/QZEming/sentence-to-game/tree/main/games/002-shuttle-arena/src">源码</a>
    <a href="https://github.com/QZEming/sentence-to-game/blob/main/games/002-shuttle-arena/prompt.txt">提示词</a>
  </div>
</article>
<article class="game">
  <span class="number">003</span>
  <h2>风原纪 · Wildreach</h2>
  <div class="links">
    <a class="play" href="games/003-wildreach/">开始体验 <span aria-hidden="true">↗</span></a>
    <a href="https://github.com/QZEming/sentence-to-game/tree/main/games/003-wildreach/src">源码</a>
    <a href="https://github.com/QZEming/sentence-to-game/blob/main/games/003-wildreach/prompt.txt">提示词</a>
  </div>
</article>
    </section>
    <footer><a href="https://github.com/QZEming/sentence-to-game">在 GitHub 查看项目、提示词与源码</a></footer>
  </main>
</body>
</html>
