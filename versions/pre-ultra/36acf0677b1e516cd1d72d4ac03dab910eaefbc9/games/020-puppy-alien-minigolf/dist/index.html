<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16182e"><title>Cosmic Pup — 星际小狗高尔夫</title><meta name="description" content="穿上太空服，与小狗一起挑战六座奇妙的外星迷你高尔夫球场。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231a2036'/%3E%3Ctext x='9' y='47' font-size='43'%3E🐾%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game" aria-label="3D 外星迷你高尔夫球场"></canvas>
<header><a class="brand" href="./"><span class="brand-icon">✦</span><span>COSMIC<span class="brand-light"> PUP</span><small>星际小狗高尔夫俱乐部</small></span></a><div class="planet-label"><span class="live-dot"></span>开普勒 · 186f <span class="sep">/</span> 星际巡回赛</div><nav><button id="sound" class="icon-button" aria-label="切换音效" title="音效">♫</button><button id="help" class="icon-button" aria-label="玩法说明" title="玩法说明">?</button><button id="pause" class="icon-button" aria-label="暂停游戏" title="暂停">Ⅱ</button></nav></header>
<main><section class="level-panel"><div class="eyebrow">EXPEDITION 01 <span>✦</span> THE LITTLE ORBIT</div><h1 id="levelName">薄荷星初见</h1><p id="levelDesc">每一次小小挥杆，都是一次星际远行。</p><div class="badges"><span id="gravityBadge">◌ 标准重力</span><span id="obstacleBadge">初次着陆</span></div><div class="scoreboard"><div><small>当前球洞</small><strong><span id="holeNum">01</span><i> / 06</i></strong></div><div><small>杆数 / 标准杆</small><strong><span id="strokes">0</span><i> / <span id="par">3</span></i></strong></div><div><small>收集星星</small><strong class="gold">✦ <span id="stars">0</span><i> / 3</i></strong></div></div></section>
<aside class="mission"><span class="mission-icon">✧</span><div><small>本洞小任务</small><p id="missionText">收集星星，找到你的最佳路线</p></div></aside>
<div class="scene-label"><span>●</span> 迷你行星 · 薄荷绿洲</div>
<div id="toast" role="status"></div>
<section class="bottom-left"><div class="caddie"><span class="avatar">🐶</span><div><small>你的宇航员</small><strong>豆包 <span>准备挥杆</span></strong></div><button id="reset" title="重打本洞">↻</button></div><div class="holes" id="holes"></div><button class="text-button" id="scorecard">查看记分卡 <span>▤</span></button></section>
<section class="shot-panel"><div class="shot-heading"><span><span class="status-dot"></span><span id="shotState">轮到你啦</span></span><small id="powerText">力度 45%</small></div><label class="slider-row"><span>轻推</span><input aria-label="击球力度" id="power" type="range" min="10" max="100" value="45"><span>远击</span></label><div class="shot-actions"><button id="rotateLeft" class="angle" aria-label="向左瞄准">↶</button><button id="shoot" class="shoot">挥杆出发 <kbd>SPACE</kbd></button><button id="rotateRight" class="angle" aria-label="向右瞄准">↷</button></div><p class="hint">移动指针瞄准 · 按住球向后拖动击球</p></section>
<div class="bottom-right"><button id="camera">◎ <span>切换视角</span></button><span><kbd>R</kbd> 重打 <kbd>H</kbd> 帮助</span></div></main>
<dialog id="modal"><button id="closeModal" aria-label="关闭">×</button><div id="modalContent"></div></dialog>
<script type="module" src="game.js"></script></body></html>
